    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        background-color: #081716;
        background-image:
            linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 50px 50px;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* HEADER */

    .header {
        text-align: center;
        padding-top: 70px;
    }

    .header h1 {
        margin: 0;
        font-size: 70px;
        line-height: 1;
        font-weight: 800;
    }

    .movie-count {
        margin-top: 25px;
        font-size: 17px;
        font-weight: 700;
    }

    /* SEARCH */

    .controls {
        width: 800px;
        max-width: calc(100% - 40px);
        margin: 27px auto 58px;
        display: flex;
        gap: 10px;
    }

    .search {
        flex: 1;
        height: 53px;
        border: 0;
        outline: none;
        border-radius: 9px;
        background: #192e2d;
        color: white;
        padding: 0 20px;
        text-align: center;
        font-size: 16px;
    }

    .search::placeholder {
        color: #a9b6b5;
        font-style: italic;
    }

    .category {
        width: 170px;
        height: 53px;
        border: 0;
        outline: none;
        border-radius: 20px;
        background: #192e2d;
        color: white;
        padding: 0 15px;
        font-size: 15px;
    }

    /* MOVIE GRID */

    .movies {
        width: calc(100% - 250px);
        max-width: 1080px;
        margin-left: 100px;
        margin-right: 130px;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0;
        padding-bottom: 80px;
    }

    /* MOVIE CARD */

    .movie {
        display: block;
        color: white;
        text-decoration: none;
        min-width: 0;
    }

    .movie-image {
        position: relative;
        width: 100%;
        aspect-ratio: 2 / 3;
        overflow: hidden;
        background: #172827;
        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .movie:hover .movie-image {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .movie-image img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        position: relative;
        z-index: 2;
    }

    /* PLACEHOLDER */

    .placeholder {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: #ebe3d8;
        color: #777;
        font-size: 50px;
        font-weight: bold;
        text-align: center;
        z-index: 1;
    }

    .placeholder span {
        margin-top: 10px;
        font-size: 13px;
        font-weight: 700;
    }

    /* MOVIE NAME */

    .movie-name {
        margin-top: 10px;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 25px;
        padding: 0 5px;
    }

    /* SIDEBAR */

    .sidebar {
        position: fixed;
        top: 139px;
        right: 18px;
        width: 80px;
        padding: 18px 0;
        background: #142a29;
        border-radius: 10px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .side-button {
        width: 58px;
        height: 58px;
        margin: 3px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        color: white;
        text-decoration: none;
        font-size: 27px;
        transition: background 0.2s ease;
    }

    .side-button:hover {
        background: #203b39;
    }

    /* RESPONSIVE */

    @media (max-width: 1200px) {
        .movies {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            width: calc(100% - 220px);
            margin-left: 40px;
            margin-right: 140px;
        }
    }

    @media (max-width: 850px) {
        .header h1 {
            font-size: 55px;
        }

        .movies {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: calc(100% - 40px);
            margin-left: 20px;
            margin-right: 20px;
        }

        .sidebar {
            position: fixed;
            top: auto;
            bottom: 15px;
            left: 50%;
            right: auto;
            transform: translateX(-50%);
            width: auto;
            padding: 8px 10px;
            flex-direction: row;
        }
    }

    @media (max-width: 600px) {
        .header {
            padding-top: 45px;
        }

        .header h1 {
            font-size: 45px;
        }

        .controls {
            flex-direction: column;
        }

        .category {
            width: 100%;
        }

        .movies {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }
</style>

<!-- SEARCH + FILTER -->

<script>

    const search = document.getElementById("search");
    const category = document.getElementById("category");
    const movies = document.querySelectorAll(".movie");
    const movieCount = document.getElementById("movieCount");

    function filterMovies() {

        const searchText =
            search.value.toLowerCase().trim();

        const selectedCategory =
            category.value;

        let visibleMovies = 0;

        movies.forEach(movie => {

            const title =
                movie.dataset.title.toLowerCase();

            const movieCategory =
                movie.dataset.category;

            const matchesSearch =
                title.includes(searchText);

            const matchesCategory =
                selectedCategory === "all" ||
                movieCategory === selectedCategory;

            if (matchesSearch && matchesCategory) {

                movie.style.display = "block";

                visibleMovies++;

            } else {

                movie.style.display = "none";

            }

        });

        movieCount.textContent =
            `Showing ${visibleMovies} movies`;
    }

    search.addEventListener(
        "input",
        filterMovies
    );

    category.addEventListener(
        "change",
        filterMovies
    );

</script>
