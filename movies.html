<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background-color: #081716;
            background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 50px 50px;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding-top: 70px;
        }

        .header h1 {
            margin: 0;
            font-size: 70px;
            line-height: 1;
            font-weight: 800;
        }

        .movie-count {
            margin-top: 25px;
            font-size: 17px;
            font-weight: 700;
        }

        /* SEARCH */
        .controls {
            width: 800px;
            max-width: calc(100% - 40px);
            margin: 27px auto 58px;
            display: flex;
            gap: 10px;
        }

        .search {
            flex: 1;
            height: 53px;
            border: 0;
            outline: none;
            border-radius: 9px;
            background: #192e2d;
            color: white;
            padding: 0 20px;
            text-align: center;
            font-size: 16px;
        }

        .search::placeholder {
            color: #a9b6b5;
            font-style: italic;
        }

        .category {
            width: 170px;
            height: 53px;
            border: 0;
            outline: none;
            border-radius: 20px;
            background: #192e2d;
            color: white;
            padding: 0 15px;
            font-size: 15px;
        }

        /* MOVIE CONTAINER (MODIFIED FOR TWO-COLUMN GRID STACK) */
        .movies {
            width: calc(100% - 250px);
            max-width: 1100px; /* Wider container to comfortably fit 2 columns side-by-side */
            margin-left: 100px;
            margin-right: 130px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr)); /* Two equal columns */
            gap: 20px;
            padding-bottom: 80px;
        }

        /* BIG ROUNDED RECTANGLE BOX */
        .movie {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #142a29;
            border-radius: 20px; /* Big rounded rectangle */
            padding: 24px;
            text-decoration: none;
            min-width: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .movie:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            background: #193433;
        }

        /* MINI ROUNDED RECTANGLE LINK (FAR LEFT) */
        .mini-link {
            background-color: #1f4240;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px; /* Mini rounded rectangle */
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .movie:hover .mini-link {
            background-color: #00bcd4; /* Vibrant interactive accent on hover */
        }

        /* TOP RIGHT CONTENT ALIGNMENT */
        .movie-info {
            text-align: right;
            padding-left: 15px;
            min-width: 0; /* Prevents long titles from overflowing flex boxes */
        }

        .movie-name {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 6px 0;
            padding: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap; /* Keeps names perfectly on one line */
        }

        .movie-url {
            font-size: 13px;
            color: #a9b6b5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 139px;
            right: 18px;
            width: 80px;
            padding: 18px 0;
            background: #142a29;
            border-radius: 10px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .side-button {
            width: 58px;
            height: 58px;
            margin: 3px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 27px;
            transition: background 0.2s ease;
        }

        .side-button:hover {
            background: #203b39;
        }

        /* RESPONSIVE */
        @media (max-width: 1150px) {
            .movies {
                width: calc(100% - 220px);
                margin-left: 40px;
                margin-right: 140px;
            }
        }

        @media (max-width: 950px) {
            /* Drops down to a single-column stack on smaller tablet viewports */
            .movies {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 850px) {
            .header h1 {
                font-size: 55px;
            }
            .movies {
                width: calc(100% - 40px);
                margin-left: 20px;
                margin-right: 20px;
            }
            .sidebar {
                position: fixed;
                top: auto;
                bottom: 15px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: auto;
                padding: 8px 10px;
                flex-direction: row;
            }
        }

        @media (max-width: 600px) {
            .header {
                padding-top: 45px;
            }
            .header h1 {
                font-size: 45px;
            }
            .controls {
                flex-direction: column;
            }
            .category {
                width: 100%;
            }
            .movie {
                flex-direction: column-reverse;
                gap: 15px;
                align-items: stretch;
            }
            .movie-info {
                text-align: center;
                padding-left: 0;
            }
            .mini-link {
                text-align: center;
            }
        }
    </style>
</head>
