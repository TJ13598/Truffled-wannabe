<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestions</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
    background-color:#081716;
    background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}
.header{text-align:center;padding-top:70px}
.header h1{margin:0;font-size:65px;font-weight:800}
.header p{color:#a9b6b5;margin-top:20px}
.form-box{
    width:700px;
    max-width:calc(100% - 40px);
    margin:45px auto;
    background:#142a29;
    border-radius:15px;
    padding:30px;
}
.form-box h2{margin-top:0}
label{
    display:block;
    margin-top:18px;
    margin-bottom:8px;
    font-weight:700;
}
input,select,textarea{
    width:100%;
    border:0;
    outline:none;
    border-radius:8px;
    background:#192e2d;
    color:white;
    padding:14px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
}
input,select{height:50px}
textarea{min-height:140px;resize:vertical}
input::placeholder,textarea::placeholder{color:#8f9d9b}
.submit-button{
    width:100%;
    height:52px;
    margin-top:25px;
    border:0;
    border-radius:9px;
    background:#28504d;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}
.submit-button:hover{background:#32635f}
#message{
    text-align:center;
    color:#79d4a3;
    margin-top:15px;
    min-height:20px;
}
.sidebar{
    position:fixed;
    top:139px;
    right:18px;
    width:80px;
    padding:18px 0;
    background:#142a29;
    border-radius:10px;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
}
.side-button{
    width:58px;
    height:58px;
    margin:3px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    color:white;
    text-decoration:none;
    font-size:27px;
}
.side-button:hover{background:#203b39}
@media(max-width:850px){
    .header h1{font-size:50px}
    .sidebar{
        top:auto;
        bottom:15px;
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:auto;
        padding:8px 10px;
        flex-direction:row;
    }
}
</style>
</head>

<body>

    <nav class="sidebar">
        <a href="bivpn.html" class="side-button" title="Home">🌐</a>
        <a href="index.html" class="side-button" title="Games">🎮</a>
        <a href="movies.html" class="side-button" title="Categories">🎥</a>
        <a href="exvpn.html" class="side-button" title="Tools">🛠️</a>
        <a href="settings.html" class="side-button" title="Community">⚙️</a>
        <a href="suggestions.html" class="side-button" title="Settings">💭</a>
    </nav>

<header class="header">
    <h1>Suggestions</h1>
    <p>Have an idea? Send it in.</p>
</header>

<section class="form-box">
    <h2>Submit a Suggestion</h2>
    <form id="suggestionForm">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name (Optional)">

        <label for="type">Suggestion Type</label>
        <select id="type">
            <option value="Website">Website</option>
            <option value="Game">Game</option>
            <option value="Movie">Movie</option>
            <option value="Feature">Feature</option>
            <option value="Other">Other</option>
        </select>

        <label for="suggestion">Suggestion</label>
        <textarea id="suggestion" placeholder="Tell us your idea..." required></textarea>

        <button type="submit" class="submit-button">Submit Suggestion</button>
        <div id="message"></div>
    </form>
</section>

<script>
// --- CONFIGURATION: REPLACE THESE WITH YOUR GOOGLE FORM CONFIG ---
const FORM_ID = "YOUR_GOOGLE_FORM_ID_HERE"; 
const ENTRY_NAME = "entry.111111111";       // Entry ID for Name field
const ENTRY_TYPE = "entry.222222222";       // Entry ID for Suggestion Type
const ENTRY_TEXT = "entry.333333333";       // Entry ID for Suggestion Box
// -----------------------------------------------------------------

const form = document.getElementById("suggestionForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim() || "Anonymous";
    const type = document.getElementById("type").value;
    const suggestion = document.getElementById("suggestion").value.trim();

    if (!suggestion) return;

    // Create the background payload
    const formUrl = `https://google.com{FORM_ID}/formResponse`;
    const formData = new URLSearchParams();
    formData.append(ENTRY_NAME, name);
    formData.append(ENTRY_TYPE, type);
    formData.append(ENTRY_TEXT, suggestion);

    // Send data to Google Forms in the background
    // mode: 'no-cors' prevents errors because Google doesn't return headers to external sites
    fetch(formUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData
    })
    .then(() => {
        form.reset();
        message.style.color = "#79d4a3";
        message.textContent = "Suggestion successfully sent to our backend!";
        setTimeout(() => { message.textContent = ""; }, 4000);
    })
    .catch((error) => {
        console.error("Submission error:", error);
        message.style.color = "#ff7d7d";
        message.textContent = "Something went wrong. Please try again.";
    });
});
</script>

</body>
</html>
