<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background-color: #081716;
            background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 50px 50px;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding-top: 70px;
        }

        .header h1 {
            margin: 0;
            font-size: 70px;
            line-height: 1;
            font-weight: 800;
        }

        .movie-count {
            margin-top: 25px;
            font-size: 17px;
            font-weight: 700;
        }

        /* SEARCH */
        .controls {
            width: 800px;
            max-width: calc(100% - 40px);
            margin: 27px auto 58px;
            display: flex;
            gap: 10px;
        }

        .search {
            flex: 1;
            height: 53px;
            border: 0;
            outline: none;
            border-radius: 9px;
            background: #192e2d;
            color: white;
            padding: 0 20px;
            text-align: center;
            font-size: 16px;
        }

        .search::placeholder {
            color: #a9b6b5;
            font-style: italic;
        }

        .category {
            width: 170px;
            height: 53px;
            border: 0;
            outline: none;
            border-radius: 6px;
            background: #192e2d;
            color: white;
            padding: 0 15px;
            font-size: 15px;
        }

        /* MOVIE CONTAINER (MAIN 2-COLUMN GRID) */
        .movies {
            width: calc(100% - 250px);
            max-width: 1200px;
            margin-left: 100px;
            margin-right: 130px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            padding-bottom: 80px;
        }

        /* BIG ROUNDED RECTANGLE BOX */
        .movie {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #142a29;
            border-radius: 20px;
            padding: 24px;
            text-decoration: none;
            min-width: 0;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .movie:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            background: #193433;
        }

        /* ASYMMETRIC GRID: 2 SMALL STACKED LEFT, 1 BIG RIGHT */
        .mini-links-stack {
            display: grid;
            grid-template-columns: 100px 140px; /* Left column smaller, right column larger */
            grid-template-rows: repeat(2, 1fr);  /* Two equal rows for stacking */
            gap: 8px; 
            width: fit-content;
            flex-shrink: 0;
        }

        /* MINI ROUNDED RECTANGLE LINKS */
        .mini-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1f4240;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            transition: background 0.2s, transform 0.1s;
        }

        /* FORCES THE BIG BUTTON TO SPAN BOTH ROWS ON THE RIGHT */
        .mini-link.big-link {
            grid-column: 2;
            grid-row: 1 / 3;
            height: 100%;
        }

        .mini-link:hover {
            background-color: #00bcd4 !important;
            transform: scale(1.03);
        }

        /* TOP RIGHT CONTENT ALIGNMENT */
        .movie-info {
            text-align: right;
            padding-left: 20px;
            min-width: 0;
        }

        .movie-name {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 6px 0;
            padding: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .movie-url {
            font-size: 13px;
            color: #a9b6b5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 139px;
            right: 18px;
            width: 80px;
            padding: 18px 0;
            background: #142a29;
            border-radius: 10px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .side-button {
            width: 58px;
            height: 58px;
            margin: 3px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 27px;
            transition: background 0.2s ease;
        }

        .side-button:hover {
            background: #203b39;
        }

        /* RESPONSIVE */
        @media (max-width: 1250px) {
            .movies {
                width: calc(100% - 220px);
                margin-left: 40px;
                margin-right: 140px;
            }
        }

        @media (max-width: 950px) {
            .movies {
                grid-template-columns: 1fr; /* Adapts main stack to 1 column on smaller tablets */
            }
        }

        @media (max-width: 850px) {
            .header h1 {
                font-size: 55px;
            }
            .movies {
                width: calc(100% - 40px);
                margin-left: 20px;
                margin-right: 20px;
            }
            .sidebar {
                position: fixed;
                top: auto;
                bottom: 15px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: auto;
                padding: 8px 10px;
                flex-direction: row;
            }
        }

        @media (max-width: 600px) {
            .header {
                padding-top: 45px;
            }
            .header h1 {
                font-size: 45px;
            }
            .controls {
                flex-direction: column;
            }
            .category {
                width: 100%;
            }
            .movie {
                flex-direction: column-reverse;
                gap: 20px;
                align-items: stretch;
            }
            .mini-links-stack {
                width: 100%; /* Spans full horizontal screen width on mobile phones */
                grid-template-columns: 1fr 1.4fr; /* Balanced layout ratio for mobile devices */
            }
            .movie-info {
                text-align: center;
                padding-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <a href="bivpn.html" class="side-button" title="Home">🌐</a>
        <a href="index.html" class="side-button" title="Games">🎮</a>
        <a href="movies.html" class="side-button" title="Categories">🎥</a>
        <a href="exvpn.html" class="side-button" title="Tools">🛠️</a>
        <a href="suggestions.html" class="side-button" title="Settings">💭</a>
    </nav>

    <!-- HEADER -->
    <header class="header">
        <h1>Movies</h1>
        <div class="movie-count" id="movieCount"> Showing 6 movies </div>
    </header>

    <!-- SEARCH -->
    <div class="controls">
        <input id="search" class="search" type="text" placeholder="Search movies">
        <select id="category" class="category">
            <option value="all">all</option>
            <option value="action">Action</option>
            <option value="comedy">Comedy</option>
            <option value="horror">Horror</option>
            <option value="scifi">Sci-Fi</option>
            <option value="animation">Animation</option>
            <option value="drama">Drama</option>
        </select>
    </div>

    <!-- MOVIES CONTAINER EXAMPLE -->
    <main class="movies">
        <!-- Movie Entry Example -->
        <div class="movie">
            <div class="mini-links-stack">
                <a href="#" class="mini-link">Link 1</a>
                <a href="#" class="mini-link">Link 2</a>
                <a href="#" class="mini-link big-link">Watch Now</a>
            </div>
            <div class="movie-info">
                <h2 class="movie-name">Interstellar</h2>
                <span class="movie-url">Sci-Fi • 2014</span>
            </div>
        </div>
    </main>

</body>
</html>
