<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
    background-color:#081716;
    background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}
.header{text-align:center;padding-top:70px}
.header h1{margin:0;font-size:65px;font-weight:800}
.header p{color:#a9b6b5;margin-top:20px}
.vpn-box{
    width:650px;
    max-width:calc(100% - 40px);
    margin:50px auto;
    background:#142a29;
    border-radius:15px;
    padding:35px;
}
.status{
    display:flex;
    align-items:center;
    gap:12px;
    background:#192e2d;
    padding:18px;
    border-radius:10px;
    margin-bottom:25px;
}
.status-dot{
    width:14px;
    height:14px;
    background:#e0a11a;
    border-radius:50%;
}
.status span{color:#a9b6b5;font-size:13px}
label{display:block;margin-top:18px;margin-bottom:8px;font-weight:700}
input,select{
    width:100%;
    height:50px;
    border:0;
    outline:none;
    border-radius:8px;
    background:#192e2d;
    color:white;
    padding:0 15px;
    font-size:15px;
}
.connect{
    width:100%;
    height:52px;
    margin-top:25px;
    border:0;
    border-radius:9px;
    background:#28504d;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}
.connect:hover{background:#32635f}
.notice{
    margin-top:20px;
    padding:15px;
    border-radius:8px;
    background:#192e2d;
    color:#a9b6b5;
    font-size:13px;
    line-height:1.5;
    text-align:center;
}
.sidebar{
    position:fixed;
    top:139px;
    right:18px;
    width:80px;
    padding:18px 0;
    background:#142a29;
    border-radius:10px;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
}
.side-button{
    width:58px;
    height:58px;
    margin:3px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    color:white;
    text-decoration:none;
    font-size:27px;
}
.side-button:hover{background:#203b39}
@media(max-width:850px){
    .sidebar{
        top:auto;
        bottom:15px;
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:auto;
        padding:8px 10px;
        flex-direction:row;
    }
    .header h1{font-size:50px}
}
</style>
</head>

<body>

           <nav class="sidebar">
        <a href="bivpn.html" class="side-button" title="Home">🌐</a>
        <a href="index.html" class="side-button" title="Games">🎮</a>
        <a href="movies.html" class="side-button" title="Categories">🎥</a>
        <a href="exvpn.html" class="side-button" title="Tools">🛠️</a>
    
        <a href="suggestions.html" class="side-button" title="Settings">💭</a>
    </nav>

<header class="header">
    <h1>VPN</h1>
    <p>Built-in VPN connection</p>
</header>

<main class="vpn-box">

    <div class="status">
        <div class="status-dot"></div>
        <div>
            <strong>VPN Not Connected</strong><br>
            <span>The built-in VPN is currently unavailable.</span>
        </div>
    </div>

    <label for="server">VPN Server</label>
    <select id="server">
        <option>Automatic</option>
        <option>United States</option>
        <option>Canada</option>
        <option>United Kingdom</option>
        <option>Germany</option>
    </select>

    <label for="protocol">Protocol</label>
    <select id="protocol">
        <option>Automatic</option>
        <option>WireGuard</option>
        <option>OpenVPN</option>
        <option>IKEv2</option>
    </select>

    <label for="username">Username</label>
    <input id="username" type="text" placeholder="VPN username">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="VPN password">

    <button class="connect" onclick="notAvailable()">
        Connect
    </button>

    <div class="notice" id="notice">
        VPN functionality has not been implemented yet.
        This page is currently a setup interface only.
    </div>

</main>

<script>
function notAvailable(){
    document.getElementById("notice").textContent =
    "The built-in VPN is currently unavailable. No connection was made.";
}
</script>

</body>
</html>
