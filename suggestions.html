<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestions</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
    background-color:#081716;
    background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}
.header{text-align:center;padding-top:70px}
.header h1{margin:0;font-size:65px;font-weight:800}
.header p{color:#a9b6b5;margin-top:20px}

/* Main Display Card Container */
.form-box{
    width:700px;
    max-width:calc(100% - 40px);
    margin:45px auto;
    background:#142a29;
    border-radius:15px;
    padding:45px 30px;
    text-align:center;
    border: 1px solid rgba(40, 80, 77, 0.5);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
.form-box h2{
    margin-top:0;
    font-size: 28px;
    font-weight: 700;
}
.form-box p {
    color: #8f9d9b;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 30px;
}

/* Premium Animated Link Button */
.portal-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 400px;
    height: 60px;
    background: #28504d;
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: 700;
    border-radius: 12px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(40, 80, 77, 0.4);
}

.portal-button:hover {
    background: #32635f;
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(121, 212, 163, 0.3);
    border: 1px solid rgba(121, 212, 163, 0.4);
}

.portal-button .icon {
    font-size: 22px;
    transition: transform 0.3s ease;
}

.portal-button:hover .icon {
    transform: translateX(4px) scale(1.1);
}

.sidebar{
    position:fixed;
    top:139px;
    right:18px;
    width:80px;
    padding:18px 0;
    background:#142a29;
    border-radius:10px;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
}
.side-button{
    width:58px;
    height:58px;
    margin:3px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    color:white;
    text-decoration:none;
    font-size:27px;
}
.side-button:hover{background:#203b39}

@media(max-width:850px){
    .header h1{font-size:50px}
    .sidebar{
        top:auto;
        bottom:15px;
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:auto;
        padding:8px 10px;
        flex-direction:row;
    }
}
</style>
</head>

<body>

    <nav class="sidebar">
        <a href="bivpn.html" class="side-button" title="Home">🌐</a>
        <a href="index.html" class="side-button" title="Games">🎮</a>
        <a href="movies.html" class="side-button" title="Categories">🎥</a>
        <a href="exvpn.html" class="side-button" title="Tools">🛠️</a>
        <a href="settings.html" class="side-button" title="Community">⚙️</a>
        <a href="suggestions.html" class="side-button" title="Settings">💭</a>
    </nav>

<header class="header">
    <h1>Suggestions</h1>
    <p>Have an idea? Send it in.</p>
</header>

<section class="form-box">
    <h2>Share Your Thoughts</h2>
    <p>
        Click the portal button below to open our submission layout. <br>
        All responses are securely and anonymously handled directly via Google Forms.
    </p>
    
    <!-- Link pointing directly to your specific public Google Form -->
    <a href="https://google.com" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="portal-button">
       <span>Open Suggestion Portal</span>
       <span class="icon">🚀</span>
    </a>
</section>

</body>
</html>
