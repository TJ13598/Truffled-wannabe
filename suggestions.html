<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestions</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
    background-color:#081716;
    background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:50px 50px;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}
.header{text-align:center;padding-top:70px}
.header h1{margin:0;font-size:65px;font-weight:800}
.header p{color:#a9b6b5;margin-top:20px}
.form-box{
    width:700px;
    max-width:calc(100% - 40px);
    margin:45px auto;
    background:#142a29;
    border-radius:15px;
    padding:30px;
}
.form-box h2{margin-top:0}
label{
    display:block;
    margin-top:18px;
    margin-bottom:8px;
    font-weight:700;
}
input,select,textarea{
    width:100%;
    border:0;
    outline:none;
    border-radius:8px;
    background:#192e2d;
    color:white;
    padding:14px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
}
input,select{height:50px}
textarea{min-height:140px;resize:vertical}
input::placeholder,textarea::placeholder{color:#8f9d9b}
.submit-button{
    width:100%;
    height:52px;
    margin-top:25px;
    border:0;
    border-radius:9px;
    background:#28504d;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}
.submit-button:hover{background:#32635f}
#message{
    text-align:center;
    color:#79d4a3;
    margin-top:15px;
    min-height:20px;
}
.sidebar{
    position:fixed;
    top:139px;
    right:18px;
    width:80px;
    padding:18px 0;
    background:#142a29;
    border-radius:10px;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
}
.side-button{
    width:58px;
    height:58px;
    margin:3px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    color:white;
    text-decoration:none;
    font-size:27px;
}
.side-button:hover{background:#203b39}
@media(max-width:850px){
    .header h1{font-size:50px}
    .sidebar{
        top:auto;
        bottom:15px;
        left:50%;
        right:auto;
        transform:translateX(-50%);
        width:auto;
        padding:8px 10px;
        flex-direction:row;
    }
}
/* Completely hides the iframe window */
#hidden_iframe {
    display: none;
}
</style>
</head>

<body>

    <nav class="sidebar">
        <a href="bivpn.html" class="side-button" title="Home">🌐</a>
        <a href="index.html" class="side-button" title="Games">🎮</a>
        <a href="movies.html" class="side-button" title="Categories">🎥</a>
        <a href="exvpn.html" class="side-button" title="Tools">🛠️</a>
        <a href="settings.html" class="side-button" title="Community">⚙️</a>
        <a href="suggestions.html" class="side-button" title="Settings">💭</a>
    </nav>

<header class="header">
    <h1>Suggestions</h1>
    <p>Have an idea? Send it in.</p>
</header>

<section class="form-box">
    <h2>Submit a Suggestion</h2>
    
    <!-- The target attribute points directly to our hidden iframe below -->
    <form id="suggestionForm" action="https://google.com" method="POST" target="hidden_iframe">
        
        <!-- These input hidden fields hold the formatted data sent to Google -->
        <input type="hidden" name="entry.293556321" id="google_name">
        <input type="hidden" name="entry.1562824323" id="google_suggestion">

        <!-- User interface fields -->
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name (Optional)">

        <label for="type">Suggestion Type</label>
        <select id="type">
            <option value="Website">Website</option>
            <option value="Game">Game</option>
            <option value="Movie">Movie</option>
            <option value="Feature">Feature</option>
            <option value="Other">Other</option>
        </select>

        <label for="suggestion">Suggestion</label>
        <textarea id="suggestion" placeholder="Tell us your idea..." required></textarea>

        <button type="submit" class="submit-button">Submit Suggestion</button>
        <div id="message"></div>
    </form>
</section>

<!-- The hidden frame that catches Google's response page -->
<iframe name="hidden_iframe" id="hidden_iframe"></iframe>

<script>
const form = document.getElementById("suggestionForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
    const name = document.getElementById("name").value.trim() || "Anonymous";
    const type = document.getElementById("type").value;
    const rawSuggestion = document.getElementById("suggestion").value.trim();

    if (!rawSuggestion) {
        event.preventDefault();
        return;
    }

    // Maps your clean web layout right into Google's specific field structures
    document.getElementById("google_name").value = `Submitted by: ${name}`;
    document.getElementById("google_suggestion").value = `[${type}] ${rawSuggestion}`;

    // Show a quick custom success message and reset the visible elements
    setTimeout(() => {
        form.reset();
        message.style.color = "#79d4a3";
        message.textContent = "Suggestion successfully sent!";
        setTimeout(() => { message.textContent = ""; }, 4000);
    }, 500);
});
</script>

</body>
</html>
