<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background-color: #081716;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 50px 50px;

            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            padding-top: 70px;
        }

        .header h1 {
            margin: 0;
            font-size: 70px;
            line-height: 1;
            font-weight: 800;
        }

        .game-count {
            margin-top: 25px;
            font-size: 17px;
            font-weight: 700;
        }


        /* =========================
           SEARCH
        ========================= */

        .controls {
            width: 800px;
            max-width: calc(100% - 40px);

            margin: 27px auto 58px;

            display: flex;
            gap: 10px;
        }

        .search {
            flex: 1;

            height: 53px;

            border: 0;
            outline: none;

            border-radius: 9px;

            background: #192e2d;

            color: white;

            padding: 0 20px;

            text-align: center;

            font-size: 16px;
        }

        .search::placeholder {
            color: #a9b6b5;
            font-style: italic;
        }

        .category {
            width: 170px;

            height: 53px;

            border: 0;
            outline: none;

            border-radius: 20px;

            background: #192e2d;

            color: white;

            padding: 0 15px;

            font-size: 15px;
        }


        /* =========================
           GAME GRID
        ========================= */

        .games {
            width: calc(100% - 250px);
            max-width: 1080px;

            margin-left: 100px;
            margin-right: 130px;

            display: grid;

            grid-template-columns: repeat(5, minmax(0, 1fr));

            gap: 20px;

            padding-bottom: 80px;
        }


        /* =========================
           GAME CARD
        ========================= */

        .game {
            display: block;

            color: white;
            text-decoration: none;

            min-width: 0;
        }

        .game-image {
            width: 100%;
            aspect-ratio: 1 / 1;

            overflow: hidden;

            border-radius: 10px;

            background: #172827;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .game:hover .game-image {
            transform: translateY(-5px);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.45);
        }

        .game-image img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* =========================
           PRESET IMAGE
           
           Use this if you don't
           have a picture yet.
        ========================= */

        .placeholder {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ebe3d8;

            color: #777;

            font-size: 70px;
            font-weight: bold;
        }


        /* =========================
           GAME NAME
        ========================= */

        .game-name {
            margin-top: 10px;

            text-align: center;

            font-size: 16px;

            font-weight: 700;

            color: #ffffff;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;

            top: 139px;
            right: 18px;

            width: 80px;

            padding: 18px 0;

            background: #142a29;

            border-radius: 10px;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            align-items: center;
        }

        .side-button {
            width: 58px;
            height: 58px;

            margin: 3px 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            color: white;

            text-decoration: none;

            font-size: 27px;

            transition: background 0.2s ease;
        }

        .side-button:hover {
            background: #203b39;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1200px) {

            .games {
                grid-template-columns: repeat(4, minmax(0, 1fr));

                width: calc(100% - 220px);

                margin-left: 40px;
                margin-right: 140px;
            }
        }

        @media (max-width: 850px) {

            .header h1 {
                font-size: 55px;
            }

            .games {
                grid-template-columns: repeat(3, minmax(0, 1fr));

                width: calc(100% - 40px);

                margin-left: 20px;
                margin-right: 20px;
            }

            .sidebar {
                position: fixed;

                top: auto;
                bottom: 15px;

                left: 50%;

                right: auto;

                transform: translateX(-50%);

                width: auto;

                padding: 8px 10px;

                flex-direction: row;
            }
        }

        @media (max-width: 600px) {

            .header {
                padding-top: 45px;
            }

            .header h1 {
                font-size: 45px;
            }

            .controls {
                flex-direction: column;
            }

            .category {
                width: 100%;
            }

            .games {
                grid-template-columns: repeat(2, minmax(0, 1fr));

                gap: 14px;
            }
        }
    </style>
</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <nav class="sidebar">

        <a href="index.html"
           class="side-button"
           title="Home">
            🏠
        </a>

        <a href="#games"
           class="side-button"
           title="Games">
            🎮
        </a>

        <a href="#games"
           class="side-button"
           title="Categories">
            🗂️
        </a>

        <a href="#"
           class="side-button"
           title="Tools">
            🛠️
        </a>

        <a href="#"
           class="side-button"
           title="Community">
            🎮
        </a>

        <a href="#"
           class="side-button"
           title="Settings">
            ⚙️
        </a>

    </nav>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <h1>Games</h1>

        <div class="game-count">
            Showing 6 games
        </div>

    </header>


    <!-- =========================
         SEARCH
    ========================= -->

    <div class="controls">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search games"
        >

        <select id="category" class="category">

            <option value="all">
                all
            </option>

            <option value="action">
                Action
            </option>

            <option value="arcade">
                Arcade
            </option>

            <option value="puzzle">
                Puzzle
            </option>

            <option value="sports">
                Sports
            </option>

        </select>

    </div>


    <!-- =========================
         GAMES
    ========================= -->

    <main class="games" id="games">


        <!-- GAME 1 -->

        <a
            class="game"
            href="slope.html"
            data-name="Slope"
            data-category="arcade"
        >

            <div class="game-image">

                <img
                    src="images (30).jpeg"
                    alt="Game One"
                >

            </div>

            <div class="game-name">
                Game One
            </div>

        </a>


        <!-- GAME 2 -->

        <a
            class="game"
            href="games/game2.html"
            data-name="Game Two"
            data-category="action"
        >

            <div class="game-image">

                <img
                    src="images/game2.jpg"
                    alt="Game Two"
                >

            </div>

            <div class="game-name">
                Game Two
            </div>

        </a>


        <!-- GAME 3 -->

        <a
            class="game"
            href="games/game3.html"
            data-name="2048"
            data-category="puzzle"
        >

            <div class="game-image">

                <img
                    src="images/2048.jpg"
                    alt="2048"
                >

            </div>

            <div class="game-name">
                2048
            </div>

        </a>


        <!-- GAME 4 -->

        <a
            class="game"
            href="games/game4.html"
            data-name="Football"
            data-category="sports"
        >

            <div class="game-image">

                <img
                    src="images/football.jpg"
                    alt="Football"
                >

            </div>

            <div class="game-name">
                Football
            </div>

        </a>


        <!-- GAME 5 -->

        <a
            class="game"
            href="games/game5.html"
            data-name="10 Minutes Till Dawn"
            data-category="action"
        >

            <div class="game-image">

                <img
                    src="images/10-minutes.jpg"
                    alt="10 Minutes Till Dawn"
                >

            </div>

            <div class="game-name">
                10 Minutes Till Dawn
            </div>

        </a>


        <!-- GAME 6 -->

        <a
            class="game"
            href="games/game6.html"
            data-name="60 Seconds"
            data-category="arcade"
        >

            <div class="game-image">

                <img
                    src="images/60-seconds.jpg"
                    alt="60 Seconds"
                >

            </div>

            <div class="game-name">
                60 Seconds
            </div>

        </a>


    </main>


    <!-- =========================
         SEARCH SCRIPT
    ========================= -->

    <script>

        const search = document.getElementById("search");
        const category = document.getElementById("category");
        const games = document.querySelectorAll(".game");

        function filterGames() {

            const searchValue =
                search.value.toLowerCase().trim();

            const categoryValue =
                category.value;

            games.forEach(function(game) {

                const name =
                    game.dataset.name.toLowerCase();

                const gameCategory =
                    game.dataset.category;

                const searchMatch =
                    name.includes(searchValue);

                const categoryMatch =
                    categoryValue === "all" ||
                    gameCategory === categoryValue;

                if (searchMatch && categoryMatch) {

                    game.style.display = "block";

                } else {

                    game.style.display = "none";

                }

            });

        }

        search.addEventListener(
            "input",
            filterGames
        );

        category.addEventListener(
            "change",
            filterGames
        );

    </script>

</body>
</html>
