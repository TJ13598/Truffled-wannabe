<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalization</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background-color: #081716;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 50px 50px;

            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;

            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }

        /* Dynamic primary theme colors applied via JavaScript */
        body.theme-green { --primary-color: #1f766d; }
        body.theme-blue { --primary-color: #315f9c; }
        body.theme-purple { --primary-color: #69459c; }
        body.theme-red { --primary-color: #9c4545; }
        body.theme-orange { --primary-color: #a66a32; }
        body.theme-pink { --primary-color: #9c4577; }

        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            padding-top: 70px;
        }

        .header h1 {
            margin: 0;
            font-size: 60px;
            line-height: 1;
            font-weight: 800;
        }

        .header p {
            margin-top: 18px;
            color: #a9b6b5;
            font-size: 16px;
        }


        /* =========================
           SETTINGS CONTAINER
        ========================= */

        .settings {
            width: 800px;
            max-width: calc(100% - 40px);

            margin: 45px auto 100px;

            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        /* =========================
           SETTING CARD
        ========================= */

        .setting-card {
            background: #142a29;

            border-radius: 10px;

            padding: 24px 26px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.20);
        }

        .setting-title {
            font-size: 19px;
            font-weight: 700;

            margin-bottom: 7px;
        }

        .setting-description {
            color: #a9b6b5;

            font-size: 14px;

            margin-bottom: 18px;
        }


        /* =========================
           SELECT
        ========================= */

        select {
            width: 100%;
            height: 48px;

            border: 0;
            outline: none;

            border-radius: 7px;

            background: #192e2d;
            color: white;

            padding: 0 15px;

            font-size: 15px;

            cursor: pointer;
        }


        /* =========================
           COLOR OPTIONS
        ========================= */

        .colors {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .color {
            width: 42px;
            height: 42px;

            border-radius: 8px;

            border: 3px solid transparent;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                border 0.15s ease;
        }

        .color:hover {
            transform: translateY(-3px);
        }

        .color.active {
            border-color: white;
        }

        .green { background: #1f766d; }
        .blue { background: #315f9c; }
        .purple { background: #69459c; }
        .red { background: #9c4545; }
        .orange { background: #a66a32; }
        .pink { background: #9c4577; }


        /* =========================
           TOGGLE
        ========================= */

        .toggle-row {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 8px 0;
        }

        .toggle-text {
            font-size: 15px;
        }

        .toggle {
            position: relative;

            width: 52px;
            height: 28px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;

            cursor: pointer;

            inset: 0;

            background: #263d3b;

            border-radius: 20px;

            transition: 0.2s;
        }

        .slider:before {
            content: "";

            position: absolute;

            width: 22px;
            height: 22px;

            left: 3px;
            top: 3px;

            background: white;

            border-radius: 50%;

            transition: 0.2s;
        }

        input:checked + .slider {
            background: var(--primary-color, #1f766d);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;
            gap: 12px;

            margin-top: 5px;
        }

        button {
            height: 48px;

            border: 0;
            border-radius: 7px;

            padding: 0 22px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            color: white;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .save {
            background: var(--primary-color, #1f766d);
        }

        .reset {
            background: #263d3b;
        }

        .reset:hover {
            background: #304947;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;

            top: 139px;
            right: 18px;

            width: 80px;

            padding: 18px 0;

            background: #142a29;

            border-radius: 10px;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            align-items: center;
        }

        .side-button {
            width: 58px;
            height: 58px;

            margin: 3px 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            color: white;

            text-decoration: none;

            font-size: 27px;

            transition: background 0.2s ease;
        }

        .side-button:hover {
            background: #203b39;
        }

        .side-button.active {
            background: #203b39;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 850px) {

            .header h1 {
                font-size: 50px;
            }

            .sidebar {
                position: fixed;

                top: auto;
                bottom: 15px;

                left: 50%;
                right: auto;

                transform: translateX(-50%);

                width: auto;

                padding: 8px 10px;

                flex-direction: row;
            }

            .side-button {
                margin: 0 3px;
            }
        }

        @media (max-width: 600px) {

            .header {
                padding-top: 45px;
            }

            .header h1 {
                font-size: 42px;
            }

            .settings {
                margin-top: 30px;
            }

            .setting-card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         SIDEBAR (Your original design cleanly closed)
    ========================= -->
    <div class="sidebar">
        <a href="#home" class="side-button">🏠</a>
        <a href="#settings" class="side-button active">⚙️</a>
        <a href="#profile" class="side-button">👤</a>
    </div>

    <!-- =========================
         HEADER 
    ========================= -->
    <div class="header">
        <h1>Personalization</h1>
        <p>Customize your experience and choose your favorite theme color.</p>
    </div>

    <!-- =========================
         SETTINGS CONTAINER
    ========================= -->
    <div class="settings">

        <!-- Card 1: Theme Selector -->
        <div class="setting-card">
            <div class="setting-title">Accent Color</div>
            <div class="setting-description">Select a dynamic primary theme color for your user interface.</div>
            <div class="colors">
                <div class="color green active" data-color="green"></div>
                <div class="color blue" data-color="blue"></div>
                <div class="color purple" data-color="purple"></div>
                <div class="color red" data-color="red"></div>
                <div class="color orange" data-color="orange"></div>
                <div class="color pink" data-color="pink"></div>
            </div>
        </div>

        <!-- Card 2: Language Selector Dropdown -->
        <div class="setting-card">
            <div class="setting-title">System Language</div>
            <div class="setting-description">Choose your preferred default display language.</div>
            <select id="lang-select">
                <option value="en">English (US)</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
